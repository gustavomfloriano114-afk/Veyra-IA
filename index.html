<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veyra IA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA DE LOGIN
    ========================== -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon">V</div>
                <div>
                    <h1>Veyra IA</h1>
                    <p>Seu assistente inteligente</p>
                </div>
            </div>

            <div id="loginForm">

                <h2>Entrar</h2>

                <p class="auth-description">
                    Entre na sua conta para continuar.
                </p>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Seu e-mail"
                    autocomplete="email"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                >

                <button id="loginButton" class="auth-button">
                    Entrar
                </button>

                <p id="loginMessage" class="auth-message"></p>

                <p class="auth-switch">
                    Não tem uma conta?
                    <button id="showSignup" type="button">
                        Criar conta
                    </button>
                </p>

            </div>


            <div id="signupForm" style="display:none;">

                <h2>Criar conta</h2>

                <p class="auth-description">
                    Crie sua conta gratuita na Veyra.
                </p>

                <input
                    id="signupName"
                    type="text"
                    placeholder="Seu nome"
                    autocomplete="name"
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Seu e-mail"
                    autocomplete="email"
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                >

                <button id="signupButton" class="auth-button">
                    Criar conta
                </button>

                <p id="signupMessage" class="auth-message"></p>

                <p class="auth-switch">
                    Já possui uma conta?
                    <button id="showLogin" type="button">
                        Entrar
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         APLICAÇÃO
    ========================== -->

    <div id="app" class="app" style="display:none;">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    V
                </div>

                <div class="logo-text">
                    <strong>Veyra</strong>
                    <span>IA</span>
                </div>

            </div>


            <button id="newChat" class="new-chat">
                <span>＋</span>
                Nova conversa
            </button>


            <div class="sidebar-title">
                Conversas
            </div>


            <div
                id="conversationList"
                class="conversation-list">
            </div>


            <div class="sidebar-bottom">

                <button
                    id="settingsBtn"
                    class="sidebar-button">

                    <span>⚙️</span>
                    Configurações

                </button>


                <button
                    id="aboutBtn"
                    class="sidebar-button">

                    <span>ℹ️</span>
                    Sobre a Veyra

                </button>

            </div>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->

        <main class="main">

            <header class="header">

                <div class="header-info">

                    <div class="header-title">
                        Veyra IA
                    </div>

                    <div
                        id="statusText"
                        class="status">
                        Online
                    </div>

                </div>


                <div
                    id="userProfile"
                    class="user-profile">

                    <div
                        id="userAvatar"
                        class="user-avatar">
                        U
                    </div>

                    <div class="user-data">

                        <strong id="userName">
                            Usuário
                        </strong>

                        <span id="userEmail">
                            —
                        </span>

                    </div>

                    <span class="profile-arrow">
                        ▾
                    </span>


                    <div
                        id="profileMenu"
                        class="profile-menu">

                        <button id="logoutButton">
                            🚪 Sair
                        </button>

                    </div>

                </div>

            </header>


            <!-- CHAT -->

            <section
                id="chat"
                class="chat">
            </section>


            <!-- INPUT -->

            <div class="input-area">

                <div class="input-box">

                    <button
                        id="imageButton"
                        class="input-action"
                        type="button"
                        title="Enviar imagem">
                        📎
                    </button>

                    <input
                        id="imageInput"
                        type="file"
                        accept="image/*"
                        hidden
                    >


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Digite sua mensagem..."
                        autocomplete="off">
                    </textarea>


                    <button
                        id="sendButton"
                        class="send-button"
                        type="button"
                        title="Enviar">
                        ➤
                    </button>

                </div>


                <div class="input-hint">
                    A Veyra pode cometer erros. Confira informações importantes.
                </div>

            </div>

        </main>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SCRIPT DA VEYRA -->

    <script src="script.js?v=2"></script>

</body>
</html>
